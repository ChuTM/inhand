<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #connecting {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
        }
        
        #connecting.hidden {
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Student "being viewed" tag (Typeless-style): small, no title bar,
           no controls. Shown only when mode=student-share. */
        body.notice-mode {
            background: transparent;
        }
        
        body.notice-mode #video-container {
            display: none;
        }
        
        #notice-tag {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 18, 18, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 10px 18px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            -webkit-user-select: none;
            user-select: none;
            -webkit-app-region: no-drag;
        }
        
        #notice-tag.hidden {
            display: none;
        }
        
        .notice-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b30;
            flex-shrink: 0;
            box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.55);
            animation: notice-pulse 1.6s ease-out infinite;
        }
        
        @keyframes notice-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.55); }
            70% { box-shadow: 0 0 0 9px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="connecting">
            <div class="spinner"></div>
            <div>Connecting to stream...</div>
        </div>
        <video id="remote-video" autoplay playsinline hidden></video>
    </div>
    <div id="notice-tag" class="hidden">
        <span class="notice-dot"></span>
        <span id="notice-text">Your teacher is viewing your screen</span>
    </div>
    
    <script src="./share-renderer.js"></script>
</body>
</html>
