<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://cdn.socket.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:">
    <title>Screen Share</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/css/share.css">
</head>
<body>
    <div id="video-container">
        <div id="connecting">
            <div class="spinner"></div>
            <div>Connecting to stream…</div>
        </div>
        <video id="remote-video" autoplay playsinline hidden></video>
    </div>

    <script src="./share-renderer.js"></script>
</body>
</html>
