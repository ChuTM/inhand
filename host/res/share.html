<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://cdn.socket.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:">
    <title>Screen Share</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* Apple Human Interface Guidelines — light theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #f5f5f7; /* macOS window background */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000; /* black letterbox well for the video content itself */
        }

        #connecting {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #6e6e73;
            font-size: 14px;
            text-align: center;
        }

        #connecting.hidden {
            display: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0, 0, 0, 0.12);
            border-top-color: #007aff; /* system blue */
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="connecting">
            <div class="spinner"></div>
            <div>Connecting to stream…</div>
        </div>
        <video id="remote-video" autoplay playsinline hidden></video>
    </div>

    <script src="./share-renderer.js"></script>
</body>
</html>
